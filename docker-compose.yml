# Local stack for `make up` and CI's image smoke test: the app on
# http://localhost:3000, where the frontend's nginx serves the SPA and proxies
# /api to the backend (not published on the host). Development settings only
# (built-in JWT secret); production runs deploy/aws/docker-compose.yml.
# Healthchecks (which `up --wait` and depends_on wait for) are the images'
# own, in the Dockerfiles.
services:
  backend:
    build:
      context: ./backend
    image: centriminds-backend:dev
    container_name: centriminds-backend
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - centriminds_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: centriminds-frontend:dev
    container_name: centriminds-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    restart: unless-stopped

  # `make dev`: the Vite dev server with hot reload on http://localhost:5173,
  # forwarding /api to the backend above. Only with --profile dev, so `make up`
  # and CI leave it out. node_modules is a volume of its own, so neither a
  # macOS install nor the checks' install in frontend/ can end up in the
  # container; npm ci runs again whenever package-lock.json has changed.
  vite:
    profiles: [dev]
    image: node:24-alpine
    container_name: centriminds-vite
    init: true
    working_dir: /app
    volumes:
      - ./frontend:/app
      - vite_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
    command:
      - sh
      - -c
      - >-
        cmp -s package-lock.json node_modules/.installed-lock
        || { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.installed-lock; }
        && exec npx vite --host 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  centriminds_data:
  vite_node_modules:
