[project]
name = "centriminds-backend"
version = "0.1.0"
description = "CentriMinds vibration analysis API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
# The app is run from source (uvicorn app.main:app), not installed as a package.
package = false
# The uv the Makefile, Dockerfile and CI install; keep them in step.
required-version = "==0.12.22"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
    "E501",   # long lines: the formatter handles what it can
    "B008",   # FastAPI's Depends()/Query() in defaults is idiomatic
    "RUF001", # en/em dashes and × in user-facing strings are intended
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make it "first party".
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fixture passwords
"alembic/**" = ["E402"]
