# Security headers for every response. Included in each location block,
# because an add_header inside a location drops the server-level ones.
# HSTS is not here: Caddy, which terminates TLS in production, sends it.
#
# CSP notes: styles need 'unsafe-inline' for React style attributes; the 3D
# text library runs in blob: workers and loads its code with importScripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
