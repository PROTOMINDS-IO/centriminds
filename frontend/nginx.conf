# The Compose stack's backend service (uvicorn).
upstream centriminds_backend {
    server backend:8000;
}

# nginx is where the client address is decided: the backend trusts what it
# is told here (backend/Dockerfile) and rate-limits sign-in per that IP. By
# default nginx reports the connection's own address and drops whatever
# X-Forwarded-For a client sent, which could otherwise be anything. Behind
# a reverse proxy of your own, list it with set_real_ip_from in an extra
# file in /etc/nginx/conf.d/ (deploy/aws/real-ip.conf does that for Caddy):
# $remote_addr then becomes the client the proxy reports.
#
# 1 when the realip module replaced the address, i.e. the request came
# through such a trusted proxy (the two addresses differ).
map "$realip_remote_addr $remote_addr" $via_trusted_proxy {
    "~^(\S+) \1$" 0;
    default 1;
}

# The scheme the client used: a trusted proxy's X-Forwarded-Proto (Caddy
# terminates TLS, so nginx itself only ever sees http), otherwise nginx's.
map "$via_trusted_proxy:$http_x_forwarded_proto" $client_scheme {
    "1:https" https;
    "1:http" http;
    default $scheme;
}

server {
    # Unprivileged image: nginx runs as uid 101 and cannot bind below 1024.
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff;
    gzip_min_length 1024;

    # Vite fingerprints everything under /assets/: cache it for a year. ^~
    # makes this prefix win over the regex below for fonts and images.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files (fonts, brand, favicon) keep their names: a day.
    location ~* \.(?:woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The SPA shell is revalidated on every load (no-cache), so a deploy is
    # picked up at once. Unknown paths get index.html and the client-side
    # router takes over (e.g. a reload on /projects/3).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API, uploads included, to FastAPI. Request bodies stream
    # through unbuffered; the size limit matches the backend's MAX_UPLOAD_MB
    # (100 MB by default) and the upload page.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://centriminds_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Set, not appended to: see the trust note at the top.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
    }
}
