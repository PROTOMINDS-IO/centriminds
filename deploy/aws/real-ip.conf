# Trust Caddy's X-Forwarded-For (see the note at the top of
# frontend/nginx.conf). Mounted into the frontend container by
# docker-compose.yml. The frontend publishes no port: only containers on
# the project's private Docker network (that is, Caddy) reach it, so any
# private address is Caddy. Caddy sets X-Forwarded-For to the address that
# connected to it and drops any a client sent, so nginx takes the last
# (and only) entry as the client.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
