# Blank issues are off so reports arrive with what is needed to act on
# them; security problems go to private reporting, never a public issue.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/protominds-io/centriminds/security/advisories/new
    about: Report privately, never in a public issue. See SECURITY.md.
  - name: Questions and commercial support
    url: https://www.protominds.io/
    about: Questions about using CentriMinds or hosting it for your machines.
